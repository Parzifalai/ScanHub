# Сборка выпуска ScanHub на GitHub (а не на компьютере автора) — условие бесплатной подписи SignPath Foundation.
# Что делает: собирает ScanHub.exe из launcher\*.cs, подписывает его через SignPath (если ключ уже добавлен),
# собирает оба архива теми же скриптами, что и раньше (dev\make_release.py, dev\make_portable.py), и SHA256SUMS.txt.
# По тегу vX.Y.Z — создаёт ЧЕРНОВИК выпуска с этими файлами; публикует автор вручную, как раньше.
name: Build

on:
  workflow_dispatch:
  push:
    branches: ["ci/**"]
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build launcher (ScanHub.exe)
        shell: pwsh
        working-directory: launcher
        run: |
          $csc = Join-Path $env:WINDIR "Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /win32icon:..\ui\scanhub.ico /out:..\ScanHub.exe `
            /r:..\window\Microsoft.Web.WebView2.Core.dll /r:..\window\Microsoft.Web.WebView2.WinForms.dll ScanHub.cs Window.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }
          Get-Item ..\ScanHub.exe | Format-List Name, Length

      - name: Upload unsigned launcher
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: launcher-unsigned
          path: ScanHub.exe
          if-no-files-found: error

      # Подпись включится сама, когда в настройках репозитория появятся секрет SIGNPATH_API_TOKEN
      # и переменная SIGNPATH_ORGANIZATION_ID (после одобрения заявки в SignPath Foundation).
      - name: Sign launcher with SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ScanHub
          signing-policy-slug: ${{ startsWith(github.ref, 'refs/tags/v') && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: launcher
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use signed launcher
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Copy-Item signed\ScanHub.exe ScanHub.exe -Force
          Get-AuthenticodeSignature ScanHub.exe | Format-List Status, SignerCertificate

      - name: Build archives
        shell: pwsh
        run: |
          python dev\make_release.py
          python dev\make_portable.py

      - name: Checksums
        shell: pwsh
        working-directory: ../ScanHub-release
        run: |
          $files = Get-ChildItem ScanHub-*.zip, ScanHub-Windows.zip | Sort-Object Name -Unique
          $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist" | Out-Null
          Copy-Item ($files.FullName + "SHA256SUMS.txt") "$env:GITHUB_WORKSPACE\dist\"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ScanHub-build
          path: dist/*
          if-no-files-found: error

      - name: Draft release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME dist\* --draft --title "ScanHub $($env:GITHUB_REF_NAME.TrimStart('v'))" `
            --notes "Draft built by GitHub Actions. Add notes from CHANGELOG before publishing."
